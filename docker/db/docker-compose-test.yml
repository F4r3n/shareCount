# Throwaway database for the backend tests; started by backend/launch_test.sh.
services:
  test_db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
