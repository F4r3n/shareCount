name: Frontend

on:
  workflow_call:
    inputs:
      upload:
        default: false
        description: "Upload"
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test

      - name: Build well known
        run: |
          mkdir build/.well-known
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > keystore.jks
          chmod +x ./scripts/generate_wellknown.sh
          ./scripts/generate_wellknown.sh keystore.jks "${{ secrets.ANDROID_KEY_PASSWORD }}" "../app/shareCount/src-tauri/tauri.conf.json" "${{ secrets.ANDROID_KEY_ALIAS }}"
          cp assetlinks.json build/.well-known/

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: "frontend"
          path: "./frontend/build"

      - name: Upload page artifact
        if: ${{ inputs.upload }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/build"
