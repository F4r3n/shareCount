[package]
name = "share_count"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.14", features = ["serde_json", "chrono", "r2d2", "numeric", "postgres", "postgres_backend"] }
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
axum = { version = "0.8.9"}
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
uuid = { version = "1.29.2", features = ["v4"] }
bigdecimal = { version = "0.4.11", features = ["serde"] }
unicode-truncate = "2.0.1"
diesel_migrations = { version = "2.3.2", features = ["postgres"] }

[dev-dependencies]
axum-test = "17.3.0"
